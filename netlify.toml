# Smok'house — configuration Netlify (site statique + fonctions serveur)
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Les fichiers techniques ne sont pas servis comme pages
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Fichiers internes (SQL, guides) : visibles sur GitHub mais jamais servis par le site
[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

